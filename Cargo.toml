[workspace]
resolver = "2"
members = [
    "crates/yaoyorozu_core",
    "crates/yaoyorozu_beby",
    "crates/yaoyorozu_ui",
]

[package]
name = "yaoyorozu-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
bevy_skein = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
yaoyorozu_core = { path = "crates/yaoyorozu_core" }
yaoyorozu_beby = { path = "crates/yaoyorozu_beby" }
yaoyorozu_ui = { path = "crates/yaoyorozu_ui" }
